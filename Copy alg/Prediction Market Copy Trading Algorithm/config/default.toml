# Exploration mode: relaxed thresholds to generate more virtual trades for evaluation.
[environment]
name = "prod"
max_orderbook_staleness_seconds = 10
max_trade_age_seconds = 5
disconnect_halt_seconds = 15
reconnect_initial_delay_seconds = 5.0
reconnect_max_delay_seconds = 60.0

[portfolio]
starting_cash = 20.0
max_open_positions = 6
max_open_btc_related_positions = 3
max_entries_per_market = 6
min_seconds_between_entries = 15
market_loss_cooldown_count = 2
market_loss_cooldown_seconds = 120
max_portfolio_exposure_ratio = 0.60
drawdown_halt_ratio = 0.50
daily_loss_halt_ratio = 0.20
loss_count_threshold = 0.03
require_negative_pnl_for_loss_frequency_halt = true
consecutive_loss_halt_count = 8
daily_loss_frequency_limit = 20

[strategy]
allowed_categories = ["financial", "climate", "crypto", "tech", "basketball"]
min_time_to_resolution_seconds = { financial = 300, climate = 300, crypto = 300, tech = 300, basketball = 600 }
min_market_volume = { financial = 100.0, climate = 100.0, basketball = 100.0, crypto = 100.0, tech = 100.0 }
price_min = 0.05
price_max = 0.95
min_no_price = 0.05
block_moderate_price_min = 0.30
block_moderate_price_max = 0.49
lower_zone_max = 0.35
middle_zone_max = 0.65
upper_zone_max = 0.80
cluster_window_seconds = 45
cluster_baseline_count = 2
cluster_elevated_count = 3
cluster_strong_count = 4
min_trade_size_ratio = 0.001
elevated_trade_size_ratio = 0.003
strong_trade_size_ratio = 0.006
moderate_drift_limit = 0.02
strong_drift_limit = 0.03
very_strong_drift_limit = 0.05
hard_drift_limit = 0.06
expected_exit_slippage_good = 0.03
expected_exit_slippage_warn = 0.10
max_entry_spread = 0.03

[execution]
moderate_p = 0.55
strong_p = 0.62
very_strong_p = 0.68
kelly_fraction = 0.25
enable_stop_losses = false
take_profit_lower_base = 0.08
take_profit_middle_base = 0.06
take_profit_upper_base = 0.04
take_profit_signal_adjustment = 0.20
take_profit_hard_ceiling = 0.79
stop_moderate = 0.06
stop_strong = 0.07
stop_very_strong = 0.08
counter_signal_single = { moderate = 0.10, strong = 0.125, very_strong = 0.15 }
counter_signal_double = { moderate = 0.05, strong = 0.075, very_strong = 0.10 }

[features]
enable_research_aggression_proxy = true
enable_related_market_inference = true
enable_passive_persistence_tracking = true
