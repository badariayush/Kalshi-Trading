[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-market-maker"
version = "0.1.0"
description = "WebSocket-driven paper market maker for Kalshi BTC 15 minute markets."
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "requests>=2.31.0",
  "websockets>=16.0",
]

[project.scripts]
mm-bot = "mm_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
